<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sym-rail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="sym-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="sym-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 배경 스퀴클 -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />

  <!-- 기상 햇살 -->
  <circle cx="32" cy="15" r="4.8" fill="url(#sym-sun)" />

  <!-- 은은한 구름 아크 -->
  <path d="M13 26c-2.8 0-5.2-2.3-5.2-5.2 0-2.5 1.9-4.7 4.3-5.1C13 10.5 16.5 7.2 20.8 7.2c4.2 0 7.7 3.2 8.1 7.2.6-.1 1.1-.2 1.6-.2"
        stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.8 2.8" opacity="0.6" />

  <!-- 모빌리티 쾌속 궤적선 -->
  <path d="M10 32 C 11 25, 16 21.5, 22 24.5 C 27 27.5, 32 24, 35.5 17"
        stroke="url(#sym-rail)" stroke-width="3.5" stroke-linecap="round" filter="url(#sym-glow)" />

  <!-- 화살촉 -->
  <path d="M30 16.5 L36 17 L35 22.5"
        stroke="url(#sym-rail)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 궤적 상의 거점 핀 -->
  <circle cx="11" cy="31.5" r="2.2" fill="#38BDF8" stroke="#0F172A" stroke-width="1.2" />
  <circle cx="22" cy="24.5" r="2.6" fill="#34D399" stroke="#0F172A" stroke-width="1.2" />
  <circle cx="36" cy="17" r="2" fill="#FFFFFF" />
</svg>
