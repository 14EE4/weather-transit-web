<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="logo-rail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="logo-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="logo-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. 좌측 브랜드 심볼 (40x40) -->
  <g transform="translate(4, 4)">
    <!-- 배경 스퀴클 -->
    <rect width="40" height="40" rx="11" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />

    <!-- 기상 햇살 -->
    <circle cx="28" cy="13" r="4.2" fill="url(#logo-sun)" />

    <!-- 은은한 구름 아크 -->
    <path d="M11 23c-2.5 0-4.5-2-4.5-4.5 0-2.2 1.6-4.1 3.7-4.4C11 9.5 14.1 6.5 17.8 6.5c3.7 0 6.7 2.8 7.1 6.3.5-.1.9-.1 1.3-.1"
          stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 2.5" opacity="0.6" />

    <!-- 모빌리티 쾌속 궤적선 -->
    <path d="M8 28 C 9 22, 14 19, 19 21.5 C 24 24, 28 21, 31 15"
          stroke="url(#logo-rail)" stroke-width="3" stroke-linecap="round" filter="url(#logo-glow)" />

    <!-- 화살촉 -->
    <path d="M26.5 14.5 L31.5 15 L30.5 20"
          stroke="url(#logo-rail)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 궤적 상의 거점 핀 -->
    <circle cx="9" cy="27.5" r="2" fill="#38BDF8" stroke="#0F172A" stroke-width="1" />
    <circle cx="19" cy="21.5" r="2.3" fill="#34D399" stroke="#0F172A" stroke-width="1" />
    <circle cx="31.5" cy="15" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- 2. 브랜드 타이포그래피 (Weather + Move) -->
  <g transform="translate(54, 30)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5px">
      <tspan fill="#F8FAFC">Weather</tspan>
      <tspan fill="url(#logo-text-gradient)">Move</tspan>
    </text>
  </g>

  <!-- 3. 서브 인텔리전스 뱃지 (AI TRANSIT) -->
  <g transform="translate(182, 17)">
    <rect width="32" height="15" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8" />
    <text x="16" y="11" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5px">AI</text>
  </g>
</svg>
