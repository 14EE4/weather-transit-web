services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weather-transit-backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-8100}:8000"
    mem_limit: 2g
    cpus: 2.0
    networks:
      - weather-transit-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weather-transit-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weather-transit-net

networks:
  weather-transit-net:
    driver: bridge
