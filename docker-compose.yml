services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weather-transit-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    networks:
      - weather-transit-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weather-transit-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weather-transit-net

networks:
  weather-transit-net:
    driver: bridge
